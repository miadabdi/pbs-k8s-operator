---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: pbsschedules.pbs.sharifmind.ir
spec:
  group: pbs.sharifmind.ir
  names:
    kind: PBSSchedule
    listKind: PBSScheduleList
    plural: pbsschedules
    singular: pbsschedule
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.schedule
      name: Schedule
      type: string
    - jsonPath: .spec.suspend
      name: Suspend
      type: boolean
    - jsonPath: .status.lastScheduleTime
      name: LastSchedule
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        description: PBSSchedule is the Schema for the pbsschedules API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of PBSSchedule
            properties:
              repoRef:
                description: repoRef is the name of the cluster-scoped PBSRepo backups
                  are sent to.
                type: string
              schedule:
                description: schedule is a standard 5-field cron expression (minute
                  hour dom month dow).
                pattern: ^(\S+\s+){4}\S+$
                type: string
              suspend:
                description: suspend stops new backup creation; NextScheduleTime is
                  still computed.
                type: boolean
              template:
                description: template is the PBSBackup body created on each fire.
                properties:
                  notes:
                    description: |-
                      notes is carried verbatim to each created PBSBackup's spec.notes and
                      from there attached to the PBS snapshot post-upload via
                      proxmox-backup-client `snapshot notes update` (best-effort; requires
                      Datastore.Modify on the datastore namespace). PBS has no arbitrary
                      snapshot labels, so Notes is THE retention-hint channel: operators can
                      e.g. encode a keep-policy JSON here; pruning itself stays server-side.
                    type: string
                  pvcs:
                    description: pvcs is an explicit list of PVC names, as in PBSBackupSpec.
                    items:
                      type: string
                    type: array
                  selector:
                    description: selector selects PVCs by label, as in PBSBackupSpec.
                    properties:
                      matchExpressions:
                        description: matchExpressions is a list of label selector
                          requirements. The requirements are ANDed.
                        items:
                          description: |-
                            A label selector requirement is a selector that contains values, a key, and an operator that
                            relates the key and values.
                          properties:
                            key:
                              description: key is the label key that the selector
                                applies to.
                              type: string
                            operator:
                              description: |-
                                operator represents a key's relationship to a set of values.
                                Valid operators are In, NotIn, Exists and DoesNotExist.
                              type: string
                            values:
                              description: |-
                                values is an array of string values. If the operator is In or NotIn,
                                the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                the values array must be empty. This array is replaced during a strategic
                                merge patch.
                              items:
                                type: string
                              type: array
                              x-kubernetes-list-type: atomic
                          required:
                          - key
                          - operator
                          type: object
                        type: array
                        x-kubernetes-list-type: atomic
                      matchLabels:
                        additionalProperties:
                          type: string
                        description: |-
                          matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                          map is equivalent to an element of matchExpressions, whose key field is "key", the
                          operator is "In", and the values array contains only "value". The requirements are ANDed.
                        type: object
                    type: object
                    x-kubernetes-map-type: atomic
                type: object
            required:
            - repoRef
            - schedule
            - template
            type: object
          status:
            description: status defines the observed state of PBSSchedule
            properties:
              active:
                description: |-
                  active lists the names of PBSBackups from this schedule that have not
                  reached a terminal phase yet.
                items:
                  type: string
                type: array
              conditions:
                description: |-
                  conditions represent the current state of the PBSSchedule resource:
                  Ready=True/Valid when the cron parses and the repo is Ready;
                  Ready=False/InvalidCron or /RepoMissing otherwise.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastScheduleTime:
                description: lastScheduleTime is the fire time the schedule last created
                  a backup at.
                format: date-time
                type: string
              nextScheduleTime:
                description: nextScheduleTime is the computed next fire time; observability
                  only.
                format: date-time
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
