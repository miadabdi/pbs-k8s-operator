# Manager ClusterRole — mirrors config/rbac/role.yaml (generated by
# `make manifests` from the controllers' kubebuilder rbac markers). Keep in
# sync when the markers change.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pbs-operator-manager-role
  labels:
    app.kubernetes.io/name: pbs-operator
    app.kubernetes.io/managed-by: {{ .Release.Service }}
rules:
- apiGroups: [""]
  resources: [configmaps, secrets]
  verbs: [create, get, list, update, watch]
- apiGroups: [""]
  resources: [namespaces, serviceaccounts]
  verbs: [create, get, list, watch]
- apiGroups: [""]
  resources: [nodes, persistentvolumeclaims, persistentvolumes, pods]
  verbs: [get, list, watch]
- apiGroups: [""]
  resources: [pods/exec]
  verbs: [create]
- apiGroups: ["", events.k8s.io]
  resources: [events]
  verbs: [create, patch]
# Full-namespace API serialization needs get;list on every namespaced
# resource — read-everything wildcard, documented accepted risk (README).
- apiGroups: ["*"]
  resources: ["*"]
  verbs: [get, list]
- apiGroups: [batch]
  resources: [jobs]
  verbs: [create, get, list, watch]
- apiGroups: [pbs.sharifmind.ir]
  resources: [pbsbackups]
  verbs: [create, get, list, patch, update, watch]
- apiGroups: [pbs.sharifmind.ir]
  resources: [pbsbackups/status, pbsrepos/status, pbsrestores/status, pbsschedules/status]
  verbs: [get, patch, update]
- apiGroups: [pbs.sharifmind.ir]
  resources: [pbsrepos]
  verbs: [get, list, watch]
- apiGroups: [pbs.sharifmind.ir]
  resources: [pbsrestores, pbsschedules]
  verbs: [create, delete, get, list, patch, update, watch]
- apiGroups: [pbs.sharifmind.ir]
  resources: [pbsrestores/finalizers, pbsschedules/finalizers]
  verbs: [update]
- apiGroups: [rbac.authorization.k8s.io]
  resources: [clusterrolebindings, rolebindings]
  verbs: [create, get, list, watch]
# bind, resourceNames-scoped to exactly the two restore roles below.
- apiGroups: [rbac.authorization.k8s.io]
  resourceNames: [pbs-operator-pbs-restore]
  resources: [clusterroles]
  verbs: [bind]
- apiGroups: [rbac.authorization.k8s.io]
  resourceNames: [pbs-operator-pbs-restore-cluster]
  resources: [clusterroles]
  verbs: [bind]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pbs-operator-manager-rolebinding
  labels:
    app.kubernetes.io/name: pbs-operator
    app.kubernetes.io/managed-by: {{ .Release.Service }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pbs-operator-manager-role
subjects:
- kind: ServiceAccount
  name: pbs-operator-controller-manager
  namespace: {{ .Release.Namespace }}
