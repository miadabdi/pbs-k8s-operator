# Metrics endpoint authn/authz (config/rbac/metrics_* equivalent): the
# manager SA needs tokenreviews/subjectaccessreviews for the endpoint's
# filter; metrics-reader is the ClusterRole Prometheus' SA binds to scrape.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pbs-operator-metrics-auth-role
  labels:
    app.kubernetes.io/name: pbs-operator
    app.kubernetes.io/managed-by: {{ .Release.Service }}
rules:
- apiGroups: [authentication.k8s.io]
  resources: [tokenreviews]
  verbs: [create]
- apiGroups: [authorization.k8s.io]
  resources: [subjectaccessreviews]
  verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pbs-operator-metrics-auth-rolebinding
  labels:
    app.kubernetes.io/name: pbs-operator
    app.kubernetes.io/managed-by: {{ .Release.Service }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pbs-operator-metrics-auth-role
subjects:
- kind: ServiceAccount
  name: pbs-operator-controller-manager
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pbs-operator-metrics-reader
  labels:
    app.kubernetes.io/name: pbs-operator
    app.kubernetes.io/managed-by: {{ .Release.Service }}
rules:
- nonResourceURLs: ["/metrics"]
  verbs: [get]
