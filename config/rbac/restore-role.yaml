# Two-role split for the restore Job SA (pbs-restore, created by the
# controller in each TARGET namespace):
#
# 1. THIS role (pbs-restore, the broad one) is bound ONLY through a
#    per-target-namespace RoleBinding (RoleBinding→ClusterRole scopes every
#    namespaced permission to that one namespace): the SA can create/update/
#    patch/delete objects of ANY namespaced Kind there — core, apps, batch,
#    every CRD's custom resources — and read Secrets/ConfigMaps there too.
#    It can do NONE of that in any other namespace: a RoleBinding grants no
#    cluster-scoped permissions and no rights outside its own namespace.
#
# 2. config/rbac/restore-cluster-role.yaml (pbs-restore-cluster, the narrow
#    one) carries the cluster-scoped rights an api.yaml may legitimately
#    need — creating/updating Namespaces and CRDs — and is the only role
#    bound through a ClusterRoleBinding. That binding is the residual
#    cluster-wide surface of a restore, by construction: create/get/list/
#    update/patch of namespaces and CRDs, nothing else.
#
# Both claims that matter: Secrets are readable ONLY in the target
# namespace, and the blast radius of the broad grant IS the target
# namespace. Velero-class restore posture; the narrow role keeps even the
# cluster-wide part minimal (no delete on namespaces/CRDs).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pbs-restore
rules:
  # Every namespaced Kind of every group (incl. all CRDs' custom resources).
  # Effective ONLY inside the target namespace via the per-ns RoleBinding.
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
