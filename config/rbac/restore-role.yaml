# The ClusterRole the restore Job ServiceAccount (pbs-restore, created by the
# controller in each TARGET namespace) is bound to.
#
# BREADTH — DELIBERATE, read before tightening: a restore applies whatever
# its api.yaml archive contains, into a namespace the operator did not choose
# at install time. That means:
#   - every namespaced Kind (core, apps, batch, and every CRD installed on
#     the cluster — hence the * apiGroups) needs create/update/patch
#   - cluster-scoped Namespace and CustomResourceDefinition docs need
#     create/update too (the archived Namespace object itself, CRDs so
#     archived custom resources can apply)
# This is the same posture as Velero-class restore operators: the role can
# create nearly anything. It is bound ONLY to the pbs-restore SAs the
# controller provisions per target namespace (ClusterRoleBinding
# pbs-restore-<namespace>), never to the manager, and carries no read of
# Secrets beyond what apply itself needs. Namespace the restore targets and
# you namespace this blast radius.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pbs-restore
rules:
  # Namespaced objects of every group (incl. all CRDs' custom resources).
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  # Cluster-scoped kinds an api.yaml may carry: the Namespace object itself
  # and CustomResourceDefinitions (waited to Established before CRs apply).
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "create", "update", "patch"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "create", "update", "patch"]
