apiVersion: pbs.sharifmind.ir/v1
kind: PBSRestore
metadata:
  labels:
    app.kubernetes.io/name: pbs-operator
    app.kubernetes.io/managed-by: kustomize
  name: pbsrestore-sample
spec:
