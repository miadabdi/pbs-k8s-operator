  # namespace (created if missing; the PBSRestore normally lives there).
  repoRef: testenv
  snapshotRef: host/pg-backup-k8s-ctl1/2026-09-16T10:00:00Z
  targetNamespace: restore-test
  # Optional Kind filters applied to both api apply phases (Keep wins).
  # dropKinds: ["Secret"]
  # keepKinds: ["Probe"]
