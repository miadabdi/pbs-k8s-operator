# Trivial CRD: exercises CRD-first restore ordering and API serialization of
# custom resources.
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: probes.examples.sharifmind.ir
spec:
  group: examples.sharifmind.ir
  scope: Namespaced
  names:
    plural: probes
    singular: probe
    kind: Probe
    shortNames:
      - prb
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                message:
                  type: string
              required:
                - message
