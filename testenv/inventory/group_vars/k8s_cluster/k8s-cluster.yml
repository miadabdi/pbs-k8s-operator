---
# no v prefix — kubespray checksum keys are unprefixed (and 'v' breaks its
# version comparisons)
kube_version: "1.35.4"
kube_network_plugin: calico
container_manager: containerd
kube_proxy_mode: nftables
kubeconfig_localhost: true
kubectl_localhost: false
# registry.k8s.io is geo-blocked from the VMs (403): pull everything on the
# ansible controller (host docker has the proxy) and let kubespray upload to
# the nodes after containerd is installed. download_run_once is required by
# validate_inventory when download_localhost is set.
download_localhost: true
download_run_once: true
# controller pulls with docker (host has docker 29 + proxy); nerdctl is
# node-side only — without this kubespray would run nerdctl on the controller.
image_command_tool_on_localhost: docker
