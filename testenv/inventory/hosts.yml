---
# Kubespray inventory for the testenv cluster (mirrors prod group layout).
# The `pbs` VM lives outside every kubespray group on purpose: kubespray
# v2.31.0 plays only target k8s_cluster/etcd/kube_control_plane (+ an
# inventory-compat play on `all` that mutates nothing), and only
# provision/pbs.yml targets the pbs host.
all:
  vars:
    ansible_user: vagrant
    ansible_ssh_private_key_file: "{{ inventory_dir }}/../secrets/testenv_ed25519"
  hosts:
    pbs:
      ansible_host: 192.168.56.10
  children:
    # become is set PER k8s HOST, not in all.vars: kubespray plays don't set
    # become themselves (the nodes need root), but its delegate_to: localhost
    # tasks (kube artifacts dir/kubeconfig) must run unprivileged as the
    # controller user — inventory-level become would sudo them and fail.
    #
    # ip/access_ip are pinned to the host-only net (multi-NIC): VirtualBox
    # gives every VM a NAT eth0 (10.0.2.15) that is per-VM and unroutable
    # between VMs — without these pins kubespray derives the API endpoint from
    # ansible's default ipv4 and kubeadm join dials the NAT address.
    kube_control_plane:
      hosts:
        k8s-ctl1:
          ansible_host: 192.168.56.11
          ansible_become: true
          ansible_become_user: root
          ip: 192.168.56.11
          access_ip: 192.168.56.11
    etcd:
      hosts:
        k8s-ctl1:
          ansible_host: 192.168.56.11
          ansible_become: true
          ansible_become_user: root
          ip: 192.168.56.11
          access_ip: 192.168.56.11
    kube_node:
      hosts:
        k8s-node1:
          ansible_host: 192.168.56.12
          ansible_become: true
          ansible_become_user: root
          ip: 192.168.56.12
          access_ip: 192.168.56.12
    k8s_cluster:
      children:
        kube_control_plane:
        kube_node:
