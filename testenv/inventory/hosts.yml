---
# Kubespray inventory for the testenv cluster (mirrors prod group layout).
# The `pbs` VM lives outside every kubespray group on purpose: kubespray
# v2.31.0 plays only target k8s_cluster/etcd/kube_control_plane (+ an
# inventory-compat play on `all` that mutates nothing), and only
# provision/pbs.yml targets the pbs host.
all:
  vars:
    ansible_user: vagrant
    # kubespray plays don't set become themselves; without this the run dies
    # at the first root-requiring task (apt lock, Permission denied).
    ansible_become: true
    ansible_become_user: root
    ansible_ssh_private_key_file: "{{ inventory_dir }}/../secrets/testenv_ed25519"
  hosts:
    pbs:
      ansible_host: 192.168.56.10
  children:
    kube_control_plane:
      hosts:
        k8s-ctl1:
          ansible_host: 192.168.56.11
    etcd:
      hosts:
        k8s-ctl1:
          ansible_host: 192.168.56.11
    kube_node:
      hosts:
        k8s-node1:
          ansible_host: 192.168.56.12
    k8s_cluster:
      children:
        kube_control_plane:
        kube_node:
